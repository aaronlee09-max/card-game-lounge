<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>교과서 서재</title>
<style>
:root{color-scheme:light;--ink:#142e26;--muted:#53655e;--paper:#f5f4ed;--green:#21533f;--line:#d8ded5}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,sans-serif}
main{max-width:1090px;margin:auto;padding:54px 24px}
header{padding:34px;background:var(--ink);color:#fafff6;border-radius:26px}
header p{margin:0;color:#d3e6d5} h1{font-size:clamp(2.4rem,7vw,4rem);line-height:1.1;margin:.3em 0}
fieldset{border:0;padding:0;margin:0;min-width:0} legend{font-weight:700;margin-bottom:6px}
.controls,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.controls{margin:24px 0 12px}
button,input,select,a.action{font:inherit}
button,a.action,select,input[type=search]{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;color:var(--ink)}
button,a.action{cursor:pointer;text-decoration:none} button[aria-pressed=true],.primary,a.primary{background:var(--green);border-color:var(--green);color:white}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a3631d;outline-offset:2px}
input[type=search]{width:min(100%,19rem);margin-left:auto}
#books{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px;padding:0;list-style:none}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h2,.card p{margin:0}.card h2{font-size:1.2rem;overflow-wrap:anywhere}
.meta,#summary,#notice{color:var(--muted);font-size:.9rem}
.tag{align-self:flex-start;background:#e6f1e7;color:#244831;border-radius:20px;padding:2px 10px;font-size:.82rem}
.card .actions{margin-top:auto;padding-top:8px}
small{overflow-wrap:anywhere;color:var(--muted)}
dialog{color:var(--ink);border:1px solid var(--line);border-radius:16px}
#reader{width:min(960px,96vw);max-height:95vh}
#page-image{display:block;max-width:100%;height:auto;margin:auto}
dialog::backdrop{background:#142e2699}
@media print{body{visibility:hidden}}
[hidden]{display:none!important}
@media(max-width:540px){main{padding:20px 14px}header{padding:24px}input[type=search]{margin-left:0;width:100%}}
</style>
</head>

<main>
<header>
<p>2026학년도 · 과천중앙고등학교</p>
<h1>교과서 서재</h1>
<p>고1·고2는 2022 개정, 고3은 2015 개정 교과서입니다.</p>
</header>
<div class="controls">
<label for="kind">자료 종류</label>

<fieldset><legend>학년</legend><div class="actions" id="grades">
<button type="button" data-grade="0" aria-pressed="true">전체</button>
<button type="button" data-grade="1" aria-pressed="false">고1</button>
<button type="button" data-grade="2" aria-pressed="false">고2</button>
<button type="button" data-grade="3" aria-pressed="false">고3</button>
</div></fieldset>
<label for="query">책 검색</label>
<input id="query" type="search" placeholder="과목, 출판사, 저자">
<label for="filter">PDF 상태</label>
<select id="filter"><option value="all">전체</option><option value="ready">이 기기에 추가됨</option><option value="missing">이 기기에 없음</option></select>
</div>
<div class="actions"><button id="bulk" type="button" class="primary">PDF 여러 개 추가</button><span class="meta">이름이 과목과 일치하는 PDF를 자동으로 넣습니다.</span></div>
<p id="notice" role="status"></p>
<p id="summary" aria-live="polite"></p>
<ul id="books"></ul>
<input id="picker" type="file" accept=".pdf,application/pdf" hidden>
</main>
<dialog id="reader" aria-labelledby="reader-title">

    <form method="dialog"><button type="submit">닫기</button></form>
  </div>
  <p id="reader-status" role="status"></p>
  <canvas id="page-image"></canvas>
</dialog>
<dialog id="authorize">

<script>
let pdfPassword;
const books = JSON.parse(document.querySelector('#catalog').textContent);
const query = document.querySelector('#query');
const picker = document.querySelector('#picker');
const filter = document.querySelector('#filter');
const notice = document.querySelector('#notice');
const list = document.querySelector('#books');
const attachments = new Map();
const kind = document.querySelector('#kind');
const reader = document.querySelector('#reader');
const gate = document.querySelector('#authorize');
const canvas = document.querySelector('#page-image');
const readerStatus = document.querySelector('#reader-status');
const accessCode = document.querySelector('#access-code');
let pdfEngine;
let viewing;
let pendingAction;

async function renderPage(state) {
  const taskNumber = ++state.renderNumber;
  const page = await state.pdf.getPage(state.page);
  const viewport = page.getViewport({ scale: 1.5 });
  const buffer = document.createElement('canvas');
  buffer.width = Math.ceil(viewport.width);
  buffer.height = Math.ceil(viewport.height);
  await page.render({ canvas: buffer, viewport }).promise;
  if (viewing !== state || taskNumber !== state.renderNumber) return;
  canvas.width = buffer.width;
  canvas.height = buffer.height;
  canvas.getContext('2d').drawImage(buffer, 0, 0);
  readerStatus.textContent = `${state.page} / ${state.pdf.numPages} 쪽`;
  document.querySelector('#previous').disabled = state.page <= 1;
  document.querySelector('#next').disabled = state.page >= state.pdf.numPages;
}
async function openBook(book, file) {
  const state = { file, page: 1, renderNumber: 0 };
  viewing = state;
  canvas.width = 0;
  document.querySelector('#reader-title').textContent = book.title;
  readerStatus.textContent = 'PDF 여는 중…';
  reader.showModal();
  try {
    pdfEngine ??= import('https://cdn.jsdelivr.net/npm/pdfjs-dist@5.6.205/build/pdf.min.mjs');
    const engine = await pdfEngine;
    const cdn = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.6.205/';
    engine.GlobalWorkerOptions.workerSrc = cdn + 'build/pdf.worker.min.mjs';
    if (viewing !== state) return;
    state.loading = engine.getDocument({
      data: new Uint8Array(await file.arrayBuffer()),
      password: pdfPassword,
      cMapUrl: cdn + 'cmaps/', cMapPacked: true,
      standardFontDataUrl: cdn + 'standard_fonts/',
      wasmUrl: cdn + 'wasm/'
    });
    if (viewing !== state) { await state.loading.destroy(); return; }
    state.loading.onPassword = (updatePassword, reason) => {
      const entered = window.prompt(reason === engine.PasswordResponses.INCORRECT_PASSWORD
        ? 'PDF 암호가 일치하지 않아요. 다시 입력해 주세요.' : 'PDF 열기 암호를 입력해 주세요.');
      if (!entered) {
        state.loading.destroy().catch(() => {});
        return;
      }
      state.enteredPassword = entered;
      updatePassword(entered);
    };
    state.pdf = await state.loading.promise;
    if (state.enteredPassword) pdfPassword = state.enteredPassword;
    await renderPage(state);
  } catch {
    if (viewing === state) readerStatus.textContent = 'PDF를 열 수 없어요. 파일과 인터넷 연결을 확인해 주세요.';
    pdfEngine = undefined;
  }
}
reader.addEventListener('close', () => {
  const old = viewing;
  viewing = undefined;
  old?.loading?.destroy().catch(() => {});
});
function turnPage(delta) {
  if (!viewing?.pdf) return;
  viewing.page = Math.max(1, Math.min(viewing.pdf.numPages, viewing.page + delta));
  renderPage(viewing).catch(() => { readerStatus.textContent = '페이지를 표시할 수 없어요.'; });
}
document.querySelector('#previous').onclick = () => turnPage(-1);
document.querySelector('#next').onclick = () => turnPage(1);

function authorize(action) {
  if (!viewing?.pdf) return;
  if (!pdfPassword) { readerStatus.textContent = '암호가 설정된 PDF를 먼저 열어 주세요.'; return; }
  pendingAction = action;
  accessCode.value = '';
  document.querySelector('#access-status').textContent = '';
  gate.showModal();
}
document.querySelector('#save-copy').onclick = () => authorize('download');
document.querySelector('#print-copy').onclick = () => authorize('print');
document.querySelector('#authorize-form').addEventListener('submit', event => {
  if (event.submitter?.value === 'cancel') return;
  event.preventDefault();
  if (!pdfPassword || accessCode.value !== pdfPassword) {
    document.querySelector('#access-status').textContent = '암호가 일치하지 않아요.';
    return;
  }
  const state = viewing;
  accessCode.value = '';
  gate.close();
  if (!state?.pdf) return;
  if (pendingAction === 'download') {
    const url = URL.createObjectURL(state.file);
    const link = document.createElement('a');
    link.href = url;
    link.download = state.file.name;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return;
  }
  const printView = window.open('', '_blank');
  if (!printView) { readerStatus.textContent = '인쇄 창을 열 수 없어요.'; return; }
  printView.document.title = state.file.name;
  const style = printView.document.createElement('style');
  style.textContent = 'body{margin:0} img{display:block;width:100%;max-height:95vh;object-fit:contain;break-after:page} img:last-child{break-after:auto}';
  printView.document.head.append(style);
  (async () => {
    for (let index = 1; index <= state.pdf.numPages; index++) {
      if (printView.closed) return;
      readerStatus.textContent = `인쇄 준비 중… ${index}/${state.pdf.numPages}`;
      const page = await state.pdf.getPage(index);
      const viewport = page.getViewport({ scale: 1.5 });
      const output = printView.document.createElement('canvas');
      output.width = Math.ceil(viewport.width);
      output.height = Math.ceil(viewport.height);
      await page.render({ canvas: output, viewport }).promise;
      const image = printView.document.createElement('img');
      image.src = output.toDataURL('image/jpeg', 0.9);
      printView.document.body.append(image);
      await image.decode();
    }
    printView.print();
    readerStatus.textContent = `${state.page} / ${state.pdf.numPages} 쪽`;
  })().catch(() => { readerStatus.textContent = '인쇄용 페이지를 준비하지 못했어요.'; printView.close(); });
});
let grade = 0;
let activeBook = null;

function database() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('textbook-pdfs', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('files');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
const storage = database().catch(() => null);
function id(book) {
  return [book.grade, book.title, book.publisher, book.author].join('|');
}
function simplify(value) {
  return value.normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
}
function element(tag, content, className) {
  const node = document.createElement(tag);
  if (content) node.textContent = content;
  if (className) node.className = className;
  return node;
}
function selectFile(book) {
  activeBook = book;
  picker.multiple = !book;
  picker.value = '';
  picker.click();
}
function render() {
  const search = simplify(query.value);
  const totals = books.filter(book => (!grade || !book.grade || book.grade === grade)
    && (kind.value === 'all' || (book.kind || 'textbook') === kind.value));
  const matches = totals.filter(book => {
    const ready = attachments.has(id(book));
    return (filter.value === 'all' || ready === (filter.value === 'ready'))
      && simplify([book.title, book.publisher, book.author].join(' ')).includes(search);
  });
  const saved = totals.filter(book => attachments.has(id(book))).length;
  document.querySelector('#summary').textContent =
    `표시 ${matches.length}권 · 이 기기에 추가된 PDF ${saved}/${totals.length}권`;
  list.replaceChildren();
  for (const book of matches) {
    const key = id(book);
    const file = attachments.get(key);
    const card = element('li', '', 'card');
    card.append(element('span', book.kind === 'workbook' ? '마더텅' : `고${book.grade}`, 'tag'), element('h2', book.title),
      element('p', [book.publisher, book.author].filter(value => value && value !== '-').join(' · '), 'meta'));
    card.append(element('small', file ? file.name : book.collected ? '기존 교과서 ZIP에서 PDF 추가 가능' : 'PDF 미확보'));
    const actions = element('div', '', 'actions');
    if (file) {
      const open = element('button', 'PDF 읽기', 'primary');
      open.type = 'button';
      open.onclick = () => openBook(book, file);
      actions.append(open);
    }
    const add = element('button', file ? 'PDF 교체' : 'PDF 추가');
    add.type = 'button';
    add.setAttribute('aria-label', `${book.title} ${add.textContent}`);
    add.onclick = () => selectFile(book);
    actions.append(add);
    card.append(actions);
    list.append(card);
  }
  if (!matches.length) list.append(element('li', '조건에 맞는 교과서가 없어요.'));
}
function identify(file) {
  const name = simplify(file.name.replace(/\.pdf$/i, ''));
  const fixedGrade = file.name.match(/(?:^|\s)([123])학년/)?.[1];
  const workbook = name.includes('마더텅');
  const candidates = books.filter(book => (book.kind === 'workbook') === workbook
    && (!fixedGrade || !book.grade || book.grade === Number(fixedGrade))
    && name.includes(simplify(book.title)));
  const exactTitles = candidates.filter(book => simplify(book.title) === name);
  if (exactTitles.length === 1) return exactTitles[0];
  const withAuthor = candidates.filter(book => book.author && book.author !== '-' && name.includes(simplify(book.author)));
  const ranked = (withAuthor.length ? withAuthor : candidates).sort((a, b) => simplify(b.title).length - simplify(a.title).length);
  if (ranked.length === 1 || (ranked.length > 1 && simplify(ranked[0].title).length > simplify(ranked[1].title).length)) return ranked[0];
  return undefined;
}
async function saveFiles(files) {
  const db = await storage;
  if (!db) return false;
  return new Promise(resolve => {
    const transaction = db.transaction('files', 'readwrite');
    transaction.oncomplete = () => resolve(true);
    transaction.onabort = () => resolve(false);
    for (const [key, file] of files) transaction.objectStore('files').put(file, key);
  });
}
document.querySelector('#grades').addEventListener('click', event => {
  if (!event.target.matches('button[data-grade]')) return;
  grade = Number(event.target.dataset.grade);
  for (const button of event.currentTarget.querySelectorAll('button')) {
    button.setAttribute('aria-pressed', String(button === event.target));
  }
  render();
});
query.addEventListener('input', render);
filter.addEventListener('change', render);
kind.addEventListener('change', render);
document.querySelector('#bulk').onclick = () => selectFile(null);
picker.addEventListener('change', async () => {
  const files = [...picker.files];
  const selectedBook = activeBook;
  const additions = new Map();
  const skipped = [];
  for (const file of files) {
    const header = await file.slice(0, 1024).text().catch(() => '');
    const book = header.includes('%PDF-') && (selectedBook || identify(file));
    if (!book || additions.has(id(book))) { skipped.push(file.name); continue; }
    additions.set(id(book), file);
  }
  const saved = !additions.size || await saveFiles(additions).catch(() => false);
  for (const [key, file] of additions) {
    attachments.set(key, file);
  }
  notice.textContent = [
    `PDF ${additions.size}개 추가.`,
    skipped.length ? `자동 추가 실패 ${skipped.length}개. 해당 과목의 PDF 추가 버튼을 사용해 주세요. ${skipped.join(', ')}` : '',
    saved ? '' : '기기에 저장하지 못해 이 탭에서만 열 수 있어요.'
  ].filter(Boolean).join(' ');
  render();
});
storage.then(db => {
  if (!db) return;
  const request = db.transaction('files', 'readonly').objectStore('files').openCursor();
  request.onsuccess = () => {
    const cursor = request.result;
    if (!cursor) { render(); return; }
    if (!attachments.has(cursor.key)) attachments.set(cursor.key, cursor.value);
    cursor.continue();
  };
});
render();
</script>
</body>
</html>
