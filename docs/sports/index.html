<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2인용 스포츠 · 카드 게임 라운지</title>
<link rel="stylesheet" href="./sports.css">
<script type="module" src="./sports.js"></script>
</head>
<body>
<main>
  <a href="../">← 카드 게임 라운지</a>
  <h1>2인용 스포츠</h1>
  <p>같은 화면에서 두 명이 겨뤄요. 키보드와 터치 조작을 지원합니다.</p>
  <label for="sport">종목</label>
  <select id="sport"></select>
  <button id="restart" type="button">다시 시작</button>
  <p id="rules"></p>
  <div class="score"><span id="red">빨강 0</span><span id="blue">파랑 0</span></div>
  <canvas width="800" height="420" aria-label="스포츠 경기장"></canvas>
  <p id="status" role="status">경기 시작</p>
  <div class="controls">
    <fieldset><legend>빨강 · WASD + F</legend><button data-key="w" aria-label="빨강 위">↑</button><button data-key="a" aria-label="빨강 왼쪽">←</button><button data-key="s" aria-label="빨강 아래">↓</button><button data-key="d" aria-label="빨강 오른쪽">→</button><button data-key="f">동작</button></fieldset>
    <fieldset><legend>파랑 · 방향키 + Enter</legend><button data-key="ArrowUp" aria-label="파랑 위">↑</button><button data-key="ArrowLeft" aria-label="파랑 왼쪽">←</button><button data-key="ArrowDown" aria-label="파랑 아래">↓</button><button data-key="ArrowRight" aria-label="파랑 오른쪽">→</button><button data-key="Enter">동작</button></fieldset>
  </div>
</main>
</body>
</html>
