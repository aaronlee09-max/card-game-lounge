<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>복싱 · 스포츠 라운지</title><link rel="stylesheet" href="../sports.css"><script src="/qr.js" defer></script><script type="module" src="../sports.js"></script></head><body><main><a href="../">← 스포츠 종목</a><header><div><small>복싱 링</small><h1>복싱</h1></div><button id="restart">재경기</button></header><div class="network"><button id="auto">자동 매칭</button><button id="link-mode">링크 초대 매칭</button><button id="host">QR 초대 매칭</button><button id="practice">연습</button><button id="local">한 기기 2인</button><button id="leave" hidden>방 나가기</button><span id="connection" role="status">같은 화면 2인 대전</span></div><div id="room" hidden><canvas id="qr" aria-label="상대방 참가 QR"></canvas><input id="invite" aria-label="초대 링크" readonly><button id="copy-invite">링크 복사</button></div><p>좌우로 스텝을 밟고 동작으로 잽을 날리세요. 아래를 눌러 가드하고 체력을 관리하세요. 상대 체력 0이면 승리해요.</p><div class="score"><b id="red"></b><b id="blue"></b></div><canvas id="court" width="840" height="440" aria-label="복싱 경기장"></canvas><p id="status" role="status"></p><div class="controls"><fieldset><legend>빨강 · WASD · F</legend><button data-control="up" aria-label="빨강 위">↑</button><button data-control="left" aria-label="빨강 왼쪽">←</button><button data-control="down" aria-label="빨강 아래">↓</button><button data-control="right" aria-label="빨강 오른쪽">→</button><button data-control="act" aria-label="빨강 동작">동작</button></fieldset><fieldset><legend>파랑 · 방향키 · Enter</legend><button data-control="up" aria-label="파랑 위">↑</button><button data-control="left" aria-label="파랑 왼쪽">←</button><button data-control="down" aria-label="파랑 아래">↓</button><button data-control="right" aria-label="파랑 오른쪽">→</button><button data-control="act" aria-label="파랑 동작">동작</button></fieldset></div></main></body></html>
