ails><p class="subtle">새 게임 7종은 자체 제작 그래픽을 사용하는 비공식 구현입니다. 상표는 각 권리자에게 있습니다.</p><p id="offline-status" role="status"></p><button id="install-app" hidden>설치 및 다운로드</button></main></body></html>
